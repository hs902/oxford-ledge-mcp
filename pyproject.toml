# setuptools>=77 is required for the PEP 639 `license` SPDX string + `license-files`
# (see 3.0.1 SPDX cleanup). Older setuptools do not understand the SPDX form.
[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxford-ledge-mcp"
version = "3.2.0"
description = "MCP server for Oxford Ledge — 13 gov-public-data tools for SEC filings, fundamentals, institutional & insider ownership, macro rates, and BDC/private-credit holdings from Claude Desktop"
readme = "README.md"
# PEP 639: SPDX expression + explicit license file (replaces the deprecated
# `license = {text = "MIT"}` table + the `License ::` trove classifier).
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Oxford Ledge", email = "contact@oxfordledge.com"},
]
keywords = ["mcp", "finance", "stocks", "sec", "edgar", "bdc", "credit", "fred", "claude", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
]
dependencies = []  # Y1 (2026-04-24): yfinance removed. Core stdlib only.

[project.optional-dependencies]
mcp = ["mcp>=1.0.0,<2"]  # <2: the 2.0 major removed the low-level Server API this package uses (2026-08-10 vet, CHAOS pin)

[project.urls]
Homepage = "https://www.oxfordledge.com"
Repository = "https://github.com/hs902/oxford-ledge-mcp"
Documentation = "https://www.oxfordledge.com/mcp"

[project.scripts]
oxford-ledge-mcp = "oxford_ledge_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
