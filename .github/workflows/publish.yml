name: Publish to PyPI (Trusted Publishing / OIDC)

# 4B (2026-07-21): publish oxford-ledge-mcp via PyPI Trusted Publishing — no
# long-lived API token. PyPI verifies a short-lived OIDC token minted by this
# workflow against the Trusted Publisher configured on the project
# (pypi.org/manage/project/oxford-ledge-mcp/settings/publishing/):
#   Owner: hs902   Repo: oxford-ledge-mcp   Workflow: publish.yml   Environment: pypi
#
# Trigger: a published GitHub Release (deliberate) — tag the release to match the
# pyproject version (e.g. v3.0.1). workflow_dispatch is kept for a manual dry-run
# that builds + asserts + twine-checks but does NOT publish.
#
# The CISO pre-upload conditions are baked in as gates: the wheel must contain
# oxford_ledge_mcp_core/ticker.py + LICENSE and must NOT contain tools_manifest.py,
# a services/ module, or any secret-shaped file.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-check:
    name: Build + assert clean artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Assert clean wheel (CISO wheel-content conditions)
        run: |
          set -euo pipefail
          WHL="$(ls dist/*.whl)"
          echo "Inspecting $WHL"
          python -m zipfile -l "$WHL" | tee /tmp/whl.txt
          if grep -qE 'tools_manifest\.py|tool_partition\.py|(^|/)services/|(^|/)\.env|(^|/)\.pypirc|tests/' /tmp/whl.txt; then
            echo "FAIL: wheel contains a forbidden file (manifest/partition/services/secret/tests)"; exit 1
          fi
          grep -q 'oxford_ledge_mcp_core/ticker\.py' /tmp/whl.txt || { echo "FAIL: ticker.py missing"; exit 1; }
          grep -q 'LICENSE' /tmp/whl.txt || { echo "FAIL: LICENSE missing"; exit 1; }
          echo "OK: wheel content assertions passed"
      - name: Assert clean wheel CONTENT (C-4, 3.2.0 vet)
        # The step above greps the archive LISTING -- a secret, an internal
        # import, or the moat write-gate INSIDE a permitted file passes it.
        # This extracts the wheel and scans file content. Sibling of the
        # monorepo test_mcp_oss_twin_parity_contract content scan.
        run: |
          set -euo pipefail
          WHL="$(ls dist/*.whl)"
          EX=/tmp/whl_x; rm -rf "$EX"; mkdir -p "$EX"
          python -m zipfile -e "$WHL" "$EX"
          fail=0
          if grep -rnE "sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY|ol_live_[0-9a-f]{8,}" "$EX"; then
            echo "FAIL: secret-shaped content inside the wheel"; fail=1; fi
          if grep -rnE "^\s*(from|import)\s+(services|pg_db|routes|middleware|schemas|learn|oxford_ledge_db)\b" "$EX" --include="*.py"; then
            echo "FAIL: monorepo upward import inside the wheel"; fail=1; fi
          if grep -rn "OL_MCP_WRITE_ENABLED" "$EX"; then
            echo "FAIL: the moat write-gate env var ships (tool_partition leak sentinel)"; fail=1; fi
          [ "$fail" -eq 0 ] && echo "OK: wheel content scan clean"
          exit "$fail"
      - name: twine check
        run: python -m twine check dist/*
      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (OIDC)
    needs: build-and-check
    # Only publish on a real Release — workflow_dispatch stops after build-and-check.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # REQUIRED: mint the OIDC token PyPI verifies. No API token.
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` / token — Trusted Publishing uses the id-token above.
